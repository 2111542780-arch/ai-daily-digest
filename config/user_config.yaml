# AI Daily Digest — 个人配置文件
# 手机端部署版：每天北京时间 08:00 推送一份约 5 分钟的综合日报

schedule:
  - time: "08:00"
    lookback_hours: 24
    label: "🌅 今日5分钟日报"
    enabled: true

filter:
  block_keywords:
    - "sponsored"
    - "advertisement"
    - "NFT"
  include_tags: []
  exclude_tags: []

tracks:
  ai:
    label: "🤖 AI / 科技"
    max_items: 5
    min_score: 1
  china:
    label: "🇨🇳 中国"
    max_items: 5
    min_score: 1
  international:
    label: "🌍 国际"
    max_items: 5
    min_score: 1
  finance:
    label: "💰 财经 / 投资"
    max_items: 5
    min_score: 1

personal_interests:
  - "DeepSeek"
  - "OpenAI"
  - "AI agent"
  - "人工智能"
  - "芯片"
  - "机器人"
  - "中美关系"
  - "中国经济"
  - "美联储"
  - "人民币"
  - "A股"
  - "港股"
  - "美股"
  - "黄金"

llm:
  provider: "deepseek"
  model: "deepseek-chat"
  summary_language: "zh"
  max_summary_chars: 140
  generate_overview: true

display:
  show_links: true
  show_source: true
  show_time: true
